name: Nightly release

# Every night: if code changed since the last release, bump the minor version,
# update CHANGELOG.md, build adbqr.exe and publish it as the latest release.

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 UTC+7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Check for code changes since the last release
        id: check
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          if [ -z "$PREV" ]; then
            echo "No previous release tag; releasing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREV" HEAD -- src ui capabilities tauri.conf.json Cargo.toml Cargo.lock build.rs assets .cargo; then
            echo "No code changes since $PREV; nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Code changed since $PREV."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the next version
        id: version
        if: steps.check.outputs.changed == 'true'
        run: |
          CUR=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if git rev-parse -q --verify "refs/tags/v$CUR" >/dev/null; then
            IFS=. read -r MAJOR MINOR _ <<< "$CUR"
            NEXT="$MAJOR.$((MINOR + 1)).0"
          else
            NEXT="$CUR" # Cargo.toml already holds an unreleased version
          fi
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::Tag v$NEXT already exists"
            exit 1
          fi
          sed -i "0,/^version = \".*\"$/s//version = \"$NEXT\"/" Cargo.toml
          echo "Releasing v$NEXT (Cargo.toml had $CUR)"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Write the changelog
        if: steps.check.outputs.changed == 'true'
        env:
          PREV: ${{ steps.check.outputs.prev }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          RANGE=${PREV:+$PREV..}HEAD
          git log --no-merges --format='- %s (%h)' "$RANGE" > "$RUNNER_TEMP/changes.md"
          {
            echo "# Changelog"
            echo
            echo "## v$NEXT - $(date -u +%Y-%m-%d)"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            if [ -f CHANGELOG.md ]; then
              sed '1{/^# Changelog$/d}' CHANGELOG.md | sed '/./,$!d'
            fi
          } > "$RUNNER_TEMP/CHANGELOG.md"
          mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          cat CHANGELOG.md

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.changed == 'true'

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: cargo build --release

      - name: Commit, tag and push
        if: steps.check.outputs.changed == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Release v$NEXT"
          git tag -a "v$NEXT" -m "v$NEXT"
          git push --atomic origin HEAD:main "refs/tags/v$NEXT"

      - name: Publish the release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          cp target/release/adbqr.exe "$RUNNER_TEMP/adbqr.exe"
          SHA=$(sha256sum "$RUNNER_TEMP/adbqr.exe" | cut -d' ' -f1)
          {
            echo "## Changes"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "## Download"
            echo
            echo "Download **adbqr.exe** below (Windows x64). It's a single file and doesn't need the VC++ redistributable. It uses Microsoft Edge WebView2, which comes with Windows 10 and 11."
            echo
            echo "You need Android SDK Platform-Tools 34 or newer (adb), and the phone must be on the same Wi-Fi network. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for usage and troubleshooting."
            echo
            echo "SHA-256 of \`adbqr.exe\`:"
            echo '```'
            echo "$SHA"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$NEXT" "$RUNNER_TEMP/adbqr.exe" \
            --title "v$NEXT" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest \
            --verify-tag
