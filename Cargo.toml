[package]
name = "adbqr"
version = "0.2.0"
edition = "2021"
description = "Desktop app: scan a QR code on an Android phone to pair and connect ADB over Wi-Fi, and disconnect Wi-Fi devices."
license = "MIT"
repository = "https://github.com/adityawibisana/ADB-Wifi-Solver"
readme = "README.md"
keywords = ["adb", "android", "wireless-debugging", "qrcode", "gui"]
categories = ["development-tools"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
