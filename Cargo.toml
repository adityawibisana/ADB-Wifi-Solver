[package]
name = "adbqr"
version = "0.3.0"
edition = "2021"
description = "Desktop app: scan a QR code on an Android phone to pair and connect ADB over Wi-Fi, and disconnect Wi-Fi devices."
license = "MIT"
repository = "https://github.com/adityawibisana/ADB-Wifi-Solver"
readme = "README.md"
keywords = ["adb", "android", "wireless-debugging", "qrcode", "gui"]
categories = ["development-tools"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Serve the bundled ui/ folder instead of a dev server, so a plain
# `cargo build` or `cargo install` produces a working app.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
strip = true
codegen-units = 1
